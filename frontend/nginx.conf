server {
    listen 80;

    # uploads up to the API's 25 MB limit (nginx allows only 1 MB by default)
    client_max_body_size 26m;

    root /usr/share/nginx/html;
    index index.html;

    # /api goes to the backend; BACKEND_URL is filled in when the container
    # starts (http://backend:8000 in docker compose, http://localhost:8000
    # on Azure). The browser only ever talks to this one address.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # an answer can take up to about a minute when the model is slow
        proxy_read_timeout 120s;
    }

    # everything else is the React app
    location / {
        try_files $uri /index.html;
    }
}

# Runs on every push to main and every pull request: all tests, the code
# checker, and a build of both Docker images. Nothing here calls Gemini
# (the tests use a fake), so CI never uses your API quota.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # adds a "Run workflow" button on GitHub

permissions:
  contents: read

# a newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  frontend:
    name: Website lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    # only worth building once the tests pass
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          # reuse layers from earlier runs, so unchanged steps are skipped
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build website image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Azure
    # only after the tests pass, and only for main (not pull requests)
    needs: [backend, frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push the image to GitHub Container Registry
      id-token: write   # log in to Azure without a stored password (OIDC)
    # never cancel a deploy halfway; a newer one waits for it instead
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/tejpalsandhu/support-rag-assistant
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the app image (API + website)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # the commit ID as the tag, so every deploy is traceable to a commit
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Point the container app at the new image
        run: |
          az containerapp update --name support-rag --resource-group support-rag-rg \
            --image "$IMAGE:${{ github.sha }}" --output none
      - name: Check the live site answers
        run: |
          url="https://$(az containerapp show --name support-rag --resource-group support-rag-rg \
            --query properties.configuration.ingress.fqdn --output tsv)"
          # the app may be scaled to zero, so allow time for it to start
          curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors \
            --max-time 30 "$url/api/health"
          echo "Live at $url"
